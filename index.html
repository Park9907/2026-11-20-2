<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행정정보 통합관리법 조항 검색</title>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--ink:#1c2a26;--muted:#5d6b66;--line:#d5dcd9;--accent:#1f5c4d;--hl:#ffe58a;--hl-ink:#1c2a26;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--surface:#1b2420;--ink:#e6eeea;--muted:#9bb0a8;--line:#2f3d38;--accent:#7fd1b9;--hl:#6b5a14;--hl-ink:#fff6d0}}
:root[data-theme="dark"]{--bg:#121917;--surface:#1b2420;--ink:#e6eeea;--muted:#9bb0a8;--line:#2f3d38;--accent:#7fd1b9;--hl:#6b5a14;--hl-ink:#fff6d0}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;line-height:1.75}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px;z-index:5}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 10px;font-weight:700}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input{flex:1 1 240px;min-width:0;font:inherit;font-size:1rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#count{font-weight:700;color:var(--accent);white-space:nowrap}
main{padding:20px}
#list{display:grid;gap:14px}
article{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:16px 18px}
article h2{margin:0 0 6px;font-size:1.05rem}
article h2 span{color:var(--accent);margin-right:8px}
article p{margin:0;white-space:pre-line;font-size:.97rem;max-width:68ch}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
#empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header><div class="wrap">
<h1>행정정보 통합관리법 조항</h1>
<div class="bar">
<input id="q" type="search" placeholder="본문 키워드를 입력하세요 (예: 개인정보)" aria-label="본문 키워드 검색" autocomplete="off">
<div id="count" role="status" aria-live="polite"></div>
</div></div></header>
<main><div class="wrap">
<div id="list"></div>
<div id="empty">일치하는 조항이 없습니다. 다른 키워드로 검색해 보세요.</div>
</div></main>
<script type="application/json" id="data">[

  },

    "조": "제2조",

  },
  {
    "조": "제3조",
    "제목": "다른 법률과의 관계",
    "본문": "행정정보의 통합관리 및 공동활용에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. 특히 「개인정보 보호법」, 「공공데이터의 제공 및 이용 활성화에 관한 법률」, 「지능정보화 기본법」에 따른 사항은 해당 법률을 우선 적용한다."
  },
  {
    "조": "제4조",
    "제목": "국가 등의 책무",
    "본문": "국가와 지방자치단체는 행정정보의 통합관리와 공동활용을 위하여 필요한 시책을 수립하여야 한다. 행정안전부장관은 그 시책을 종합적으로 조정하며, 자세한 사항은 대통령령으로 정한다."
  },
  {
    "조": "제5조",
    "제목": "기본계획의 수립",
    "본문": "① 행정안전부장관은 행정정보 통합관리 기본계획을 5년마다 수립하여야 한다.\n② 기본계획에는 다음 각 호의 사항을 포함하여야 한다.\n1. 행정정보 통합관리의 기본방향\n2. 행정정보 공동활용의 활성화 방안\n3. 「전자정부법」 제3조의 행정기관 정보화 시책과의 연계\n4. 그 밖에 대통령령으로 정하는 사항"
  },
  {
    "조": "제6조",
    "제목": "시행계획의 수립",

  },
  {

    "제목": "데이터 표준",
    "본문": "행정안전부장관은 데이터 표준을 정하여 고시할 수 있다. 데이터 표준의 적용 범위와 시기는 대통령령으로 정한다."
  },
  {
    "조": "제12조",
    "제목": "표준 적용 의무",
    "본문": "행정기관은 행정정보를 생산·관리·활용할 때 제11조에 따른 데이터 표준을 따라야 한다."
  },
  {
    "조": "제13조",
    "제목": "실태조사",
    "본문": "행정안전부장관은 매년 행정정보 통합관리 실태를 조사하여 그 결과를 공개한다."
  },
  {
    "조": "제14조",
    "제목": "과태료",
    "본문": "다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다.\n1. 제8조를 위반하여 승인 없이 공동활용한 자\n2. 제12조에 따른 데이터 표준을 정당한 사유 없이 위반한 자"
  },
  {
    "조": "제15조",
    "제목": "시행일",
    "본문": "이 법은 2026년 7월 1일부터 시행한다."

]</script>
<script>
var items=JSON.parse(document.getElementById("data").textContent);
var list=document.getElementById("list"),q=document.getElementById("q"),count=document.getElementById("count"),empty=document.getElementById("empty");
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hl(text,kw){var t=esc(text);if(!kw)return t;var k=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(k,"gi"),"<mark>$&</mark>")}
function render(){
  var kw=q.value.trim(),lk=kw.toLowerCase();
  var r=items.filter(function(i){return !kw||i["본문"].toLowerCase().indexOf(lk)!==-1});
  list.innerHTML=r.map(function(i){return '<article><h2><span>'+esc(i["조"])+'</span>'+esc(i["제목"])+'</h2><p>'+hl(i["본문"],kw)+'</p></article>'}).join("");
  count.textContent="결과 "+r.length+"건";
  empty.style.display=r.length?"none":"block";
}
q.addEventListener("input",render);
render();
</script>
</body>
</html>
